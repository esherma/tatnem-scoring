name: Release to PyPI

# Trusted publishing: PyPI trusts this workflow file + the `pypi` environment via OIDC.
# No API token exists anywhere. Push a tag vX.Y.Z matching pyproject's version.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.15"
          enable-cache: false
      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} != pyproject version ${version}"; exit 1; }
          test "$(grep -E '^__version__' src/fbscore/__init__.py | cut -d'"' -f2)" = "${version}"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv --python 3.15 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/fbscore verify tests/fixtures/binary_cash_haircut.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tatnem-scoring/
    permissions:
      id-token: write # OIDC for trusted publishing and attestations
      attestations: write # GitHub build-provenance attestation
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
