name: Simulations and long property tests

on:
  pull_request:
    paths:
      - "src/**"
      - "sims/**"
      - "tests/test_simulation.py"
      - "tests/test_properties.py"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulations:
    name: Simulation tests S1-S8
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          python-version: "3.15"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest -m slow -v
        env:
          SIM_REPORT: sim-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sim-report
          path: sim-report.json
          if-no-files-found: ignore

  long-properties:
    name: Property tests (nightly profile)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          python-version: "3.15"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest tests/test_properties.py
        env:
          HYPOTHESIS_PROFILE: nightly
