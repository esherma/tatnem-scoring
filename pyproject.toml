[project]
name = "tatnem-scoring"
version = "0.1.0"
description = "Market scoring rule, stake, settlement and aggregation library for the Tatnem forecasting platform (import name: fbscore)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Tatnem" }]
keywords = ["forecasting", "scoring rules", "market scoring rule", "CRPS", "Brier"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
verify = ["pyarrow>=21"]

[project.scripts]
fbscore = "fbscore.verify:main"

[project.urls]
Source = "https://github.com/esherma/tatnem-scoring"
Specification = "https://github.com/esherma/tatnem-scoring/blob/main/spec/scoring.md"
Security = "https://github.com/esherma/tatnem-scoring/security/policy"

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fbscore"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "jsonschema>=4.25",
    "pyarrow>=21",
    "ruff>=0.17",
    "pyright>=1.1.414",
    "zizmor>=1.32",
    "pre-commit>=4.7",
]
sims = ["numpy>=2.5", "scipy>=1.18", "matplotlib>=3.10"]

[tool.uv]
default-groups = ["dev", "sims"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["sims/forecast_bounty_sim.py", "sims/settlement_variants.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "C4", "PL", "PERF"]
ignore = ["PLR0913", "PLR0917", "PERF401", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415", "S603", "PT011", "PT018", "S607"]
"sims/**" = ["S101", "S311"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
markers = ["slow: simulation tests S1-S8 (nightly and on scoring changes)"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["fbscore"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError"]
